<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Название вкладки -->
    <title>Time Mouser</title>
    <!-- Иконка вкладки (Nerd Emoji) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤓</text></svg>">
    
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #05070f;
            --card-bg: rgba(13, 18, 36, 0.55);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --neon-gold: #fbbf24;
            --neon-purple: #a855f7;
            --neon-blue: #5865F2;
            --neon-orange: #FF5500;
            --neon-red: #FF0000;
            --neon-steam: #171a21;
            --neon-steam-accent: #66c0f4;
            --active-glow: transparent;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            cursor: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* --- Курсор --- */
        #cursor-dot {
            position: fixed;
            top: 0; left: 0;
            width: 8px; height: 8px;
            background: var(--neon-gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--neon-gold);
            will-change: transform, left, top;
        }

        #cursor-trail-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        .dynamic-glow-bg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            border-radius: 50%;
            background: var(--active-glow);
            filter: blur(160px);
            opacity: 0;
            z-index: -1;
            transition: opacity 0.5s ease, background 0.5s ease;
            pointer-events: none;
        }

        /* --- QR Кнопка --- */
        .qr-trigger-btn {
            position: fixed;
            top: 20px; right: 20px;
            width: 45px; height: 45px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .qr-trigger-btn:hover {
            border-color: var(--neon-gold);
            color: var(--neon-gold);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
        }

        .qr-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 15, 0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .qr-modal-content {
            background: #0d1224;
            border: 1px solid var(--neon-gold);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.2);
            position: relative;
            max-width: 320px;
        }

        .qr-modal-content img {
            width: 180px; height: 180px;
            border-radius: 12px;
            margin: 15px 0;
        }

        .close-qr {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 1.4rem;
            color: var(--text-sub);
            cursor: pointer;
        }

        /* --- Контейнер --- */
        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            z-index: 1;
        }

        /* --- Профиль --- */
        .profile {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-box {
            position: relative;
            width: 130px; height: 130px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar-ring {
            position: absolute;
            top: -6px; left: -6px;
            width: 142px; height: 142px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--neon-gold), #ec4899, #3b82f6, var(--neon-purple));
            background-size: 300% 300%;
            z-index: 1;
            filter: blur(8px);
            opacity: 0.8;
            animation: gradientShift 4s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .avatar-box:hover .avatar {
            transform: scale(1.08) rotate(4deg);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        .status-dot {
            width: 8px; height: 8px;
            background-color: #64748b;
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        .status-badge.is-live {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.5);
            color: #4ade80;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
        }

        .status-badge.is-live .status-dot {
            background-color: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
        }

        .profile h1 {
            font-size: 2.1rem;
            font-weight: 900;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 20%, var(--neon-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .profile p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        /* --- Кнопки --- */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            padding: 18px 22px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            backdrop-filter: blur(20px);
            text-decoration: none;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .link-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 22px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent, var(--neon-gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .link-card:hover::after { opacity: 1; }
        .link-card:hover { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); }

        .icon-box {
            width: 50px; height: 50px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 18px;
            flex-shrink: 0;
            color: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .link-text { flex-grow: 1; }

        .link-title {
            font-weight: 800;
            font-size: 1.1rem;
            display: block;
            margin-bottom: 2px;
        }

        .link-sub {
            font-size: 0.83rem;
            color: var(--text-sub);
        }

        .action-icon {
            color: rgba(255, 255, 255, 0.25);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .link-card:hover .action-icon {
            transform: translateX(4px);
            color: var(--neon-gold);
        }

        .copy-toast {
            position: absolute;
            right: 15px;
            background: #22c55e;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .copy-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .youtube { background: linear-gradient(135deg, #FF0000, #cc0000); }
        .twitch { background: linear-gradient(135deg, #a970ff, #772ce8); }
        .steam { background: linear-gradient(135deg, #171a21, #2a475e); }
        .discord { background: linear-gradient(135deg, #5865F2, #3b428a); }
        .da { background: linear-gradient(135deg, #FF9E1B, #FF5500); }

        footer {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-sub);
            opacity: 0.4;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Курсор -->
    <div id="cursor-dot"></div>
    <canvas id="cursor-trail-canvas"></canvas>

    <!-- QR Кнопка -->
    <button class="qr-trigger-btn" id="open-qr-btn" title="Показать QR-код">
        <i class="fa-solid fa-qrcode"></i>
    </button>

    <!-- Модалка QR -->
    <div class="qr-modal" id="qr-modal">
        <div class="qr-modal-content">
            <span class="close-qr" id="close-qr-btn">&times;</span>
            <h3 style="color: #fff; font-size: 1.1rem;">QR-код страницы</h3>
            <p style="color: var(--text-sub); font-size: 0.8rem; margin-top: 4px;">Отсканируй с телефона</p>
            <img id="qr-image" src="" alt="QR Code">
        </div>
    </div>

    <!-- Canvas декор -->
    <canvas id="bg-canvas"></canvas>
    <div class="dynamic-glow-bg" id="dynamic-glow"></div>

    <div class="container">
        <!-- Профиль -->
        <div class="profile">
            <div class="avatar-box">
                <div class="avatar-ring"></div>
                <img src="https://i.pinimg.com/736x/09/2d/18/092d18476bf383a5ad77926e83ef59d2.jpg" alt="Time Mouser Avatar" class="avatar" onerror="this.src='https://i.pinimg.com/474x/b6/e4/fb/b6e4fbd6be94845c6666e8729d126d2c.jpg?nii=t'">
            </div>

            <!-- Статус Стримов -->
            <div class="status-badge" id="live-status-badge">
                <span class="status-dot"></span>
                <span id="live-status-text">ПОДКЛЮЧЕНИЕ...</span>
            </div>

            <h1>Time Mouser</h1>
            <p>Стримы, игры и ламповый контент</p>
        </div>

        <!-- Кнопки -->
        <div class="links-list">

            <!-- YouTube -->
            <a href="https://www.youtube.com/@timemouser" target="_blank" class="link-card protected-link" data-glow="var(--neon-red)">
                <div class="icon-box youtube">
                    <i class="fa-brands fa-youtube"></i>
                </div>
                <div class="link-text">
                    <span class="link-title">YouTube</span>
                    <span class="link-sub">Видео и ролики</span>
                </div>
                <i class="fa-solid fa-chevron-right action-icon"></i>
            </a>

            <!-- Twitch -->
            <a href="https://twitch.tv/timemouser" target="_blank" class="link-card protected-link" data-glow="var(--neon-purple)">
                <div class="icon-box twitch">
                    <i class="fa-brands fa-twitch"></i>
                </div>
                <div class="link-text">
                    <span class="link-title">Twitch</span>
                    <span class="link-sub">Прямые трансляции</span>
                </div>
                <i class="fa-solid fa-chevron-right action-icon"></i>
            </a>

            <!-- Steam -->
            <a href="https://steamcommunity.com/id/timemouser" target="_blank" class="link-card protected-link" data-glow="var(--neon-steam-accent)">
                <div class="icon-box steam">
                    <i class="fa-brands fa-steam"></i>
                </div>
                <div class="link-text">
                    <span class="link-title">Steam</span>
                    <span class="link-sub">Профиль и обмены</span>
                </div>
                <i class="fa-solid fa-chevron-right action-icon"></i>
            </a>

            <!-- Discord -->
            <div class="link-card protected-link" id="copy-discord-btn" data-glow="var(--neon-blue)" style="cursor: pointer;">
                <div class="icon-box discord">
                    <i class="fa-brands fa-discord"></i>
                </div>
                <div class="link-text">
                    <span class="link-title">ШколоМаузер.lol</span>
                    <span class="link-sub">Нажми, чтобы скопировать инвайт</span>
                </div>
                <i class="fa-solid fa-copy action-icon"></i>
                <div class="copy-toast" id="copy-toast">Скопировано! 🎉</div>
            </div>

            <!-- DonationAlerts -->
            <a href="https://www.donationalerts.com/r/timemouser" target="_blank" class="link-card protected-link" data-glow="var(--neon-orange)">
                <div class="icon-box da">
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="link-text">
                    <span class="link-title">DonationAlerts</span>
                    <span class="link-sub">Поддержать стримера</span>
                </div>
                <i class="fa-solid fa-chevron-right action-icon"></i>
            </a>

        </div>

        <footer>© 2026 TIME MOUSER</footer>
    </div>

    <script>
        // --- 0. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (DEBOUNCE/THROTTLE) ---
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // --- 1. ШЛЕЙФ КУРСОР (С ОПТИМИЗАЦИЕЙ ПРОИЗВОДИТЕЛЬНОСТИ) ---
        const dot = document.getElementById('cursor-dot');
        const trailCanvas = document.getElementById('cursor-trail-canvas');
        const tCtx = trailCanvas.getContext('2d');

        function resizeTrailCanvas() {
            trailCanvas.width = window.innerWidth;
            trailCanvas.height = window.innerHeight;
        }
        resizeTrailCanvas();
        window.addEventListener('resize', debounce(resizeTrailCanvas, 150));

        let mouse = { x: -100, y: -100 };
        let particles = [];
        let lastParticleTime = 0;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            dot.style.left = `${mouse.x}px`;
            dot.style.top = `${mouse.y}px`;

            // Throttle создания спам-частиц курсора для защиты CPU
            const now = performance.now();
            if (now - lastParticleTime > 25) { 
                lastParticleTime = now;
                if (particles.length < 50) { // Ограничение максимального кол-ва элементов
                    particles.push({
                        x: mouse.x,
                        y: mouse.y,
                        size: Math.random() * 3 + 1,
                        alpha: 1,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.5
                    });
                }
            }
        });

        function animateTrail() {
            tCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.025;

                tCtx.beginPath();
                tCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                tCtx.fillStyle = `rgba(251, 191, 36, ${Math.max(p.alpha, 0)})`;
                tCtx.fill();

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animateTrail);
        }
        animateTrail();

        // --- 2. ПОДСВЕТКА ФОНА ---
        const glowBg = document.getElementById('dynamic-glow');
        document.querySelectorAll('.link-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                const glowColor = card.getAttribute('data-glow');
                if (glowColor) {
                    glowBg.style.background = glowColor;
                    glowBg.style.opacity = '0.25';
                }
            });
            card.addEventListener('mouseleave', () => {
                glowBg.style.opacity = '0';
            });
        });

        // --- 3. КОПИРОВАНИЕ DISCORD (ЗАЩИТА ОТ СПАМ-КЛИКОВ) ---
        const copyBtn = document.getElementById('copy-discord-btn');
        const copyToast = document.getElementById('copy-toast');
        const DISCORD_LINK = 'https://discord.gg/2yjjVhjQ';
        let isCopying = false;

        copyBtn.addEventListener('click', () => {
            if (isCopying) return;
            isCopying = true;

            navigator.clipboard.writeText(DISCORD_LINK).then(() => {
                copyToast.classList.add('show');
                setTimeout(() => {
                    copyToast.classList.remove('show');
                    isCopying = false;
                }, 1800);
            }).catch(() => {
                isCopying = false;
            });
        });

        // --- 4. QR МОДАЛКА ---
        const qrModal = document.getElementById('qr-modal');
        const openQrBtn = document.getElementById('open-qr-btn');
        const closeQrBtn = document.getElementById('close-qr-btn');
        const qrImg = document.getElementById('qr-image');

        openQrBtn.addEventListener('click', () => {
            const currentUrl = encodeURIComponent(window.location.href);
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${currentUrl}&color=fbbf24&bgcolor=0d1224`;
            qrModal.style.display = 'flex';
        });

        closeQrBtn.addEventListener('click', () => qrModal.style.display = 'none');
        qrModal.addEventListener('click', (e) => {
            if (e.target === qrModal) qrModal.style.display = 'none';
        });

        // --- 5. ДВОЙНОЙ ТРЕКИНГ СТРИМОВ (TWITCH И YOUTUBE НАДЕЖНАЯ ПРОВЕРКА) ---
        const TWITCH_CHANNEL = 'timemouser';
        const YOUTUBE_USER = 'timemouser';

        async function checkLiveStatus() {
            const badge = document.getElementById('live-status-badge');
            const statusText = document.getElementById('live-status-text');

            try {
                // 1. Проверяем Twitch
                const twResponse = await fetch(`https://decapi.me/twitch/uptime/${TWITCH_CHANNEL}`);
                if (twResponse.ok) {
                    const twData = await twResponse.text();
                    if (!twData.includes('offline') && !twData.includes('user not found')) {
                        badge.classList.add('is-live');
                        statusText.textContent = `TWITCH LIVE`;
                        return;
                    }
                }

                // 2. Стабильная проверка YouTube через NoEmbed
                const ytLiveUrl = `https://www.youtube.com/@${YOUTUBE_USER}/live`;
                const ytResponse = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(ytLiveUrl)}`);
                
                if (ytResponse.ok) {
                    const ytData = await ytResponse.json();
                    // Если стрим идёт, noembed отдает валидное название ролика и авторство
                    if (ytData && ytData.title && !ytData.error) {
                        badge.classList.add('is-live');
                        statusText.textContent = `YOUTUBE LIVE`;
                        return;
                    }
                }

                // Если везде офлайн
                badge.classList.remove('is-live');
                statusText.textContent = 'OFFLINE';

            } catch (error) {
                badge.classList.remove('is-live');
                statusText.textContent = 'TIME MOUSER';
            }
        }

        checkLiveStatus();
        // Запрос раз в 90 секунд для предотвращения лимита запросов
        setInterval(checkLiveStatus, 90000);

        // --- 6. ВОЛНЫ НА ФОНЕ ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', debounce(resize, 150));
        resize();

        let step = 0;
        function renderWaves() {
            ctx.clearRect(0, 0, width, height);
            step += 0.015;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = i === 0 ? 'rgba(251, 191, 36, 0.08)' : (i === 1 ? 'rgba(168, 85, 247, 0.08)' : 'rgba(88, 101, 242, 0.08)');
                for (let x = 0; x <= width; x += 20) {
                    const y = Math.sin(x * 0.003 + step + i) * 35 +
                              Math.cos(x * 0.001 + step) * 15 +
                              height / 2 + (i * 60 - 60);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            requestAnimationFrame(renderWaves);
        }
        renderWaves();

        // --- 7. МАГНИТНЫЙ ЭФФЕКТ КАРТОЧЕК (С ОПТИМИЗАЦИЕЙ RAF) ---
        document.querySelectorAll('.link-card').forEach(card => {
            let rafId = null;

            card.addEventListener('mousemove', (e) => {
                if (rafId) cancelAnimationFrame(rafId);
                
                rafId = requestAnimationFrame(() => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    card.style.transform = `translate(${x * 0.08}px, ${y * 0.08}px) scale(1.02)`;
                });
            });

            card.addEventListener('mouseleave', () => {
                if (rafId) cancelAnimationFrame(rafId);
                card.style.transform = 'translate(0px, 0px) scale(1)';
            });
        });
    </script>
</body>
</html>
